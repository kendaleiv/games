name: Wait for Pages artifact
description: Retry artifact discovery before creating a Pages deployment
inputs:
  artifact-name:
    description: Name shared by the upload and deployment steps
    required: true
  artifact-id:
    description: ID returned by the upload step
    required: true
runs:
  using: composite
  steps:
    - name: Install artifact client
      shell: bash
      run: npm ci --prefix "$ACTION_PATH" --ignore-scripts --no-audit --no-fund
      env:
        ACTION_PATH: ${{ github.action_path }}

    - name: Wait for artifact discovery
      uses: actions/github-script@v7
      env:
        ACTION_PATH: ${{ github.action_path }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        ARTIFACT_ID: ${{ inputs.artifact-id }}
      with:
        script: |
          const { DefaultArtifactClient } = require(`${process.env.ACTION_PATH}/node_modules/@actions/artifact`);
          const { waitForArtifact } = require(`${process.env.ACTION_PATH}/wait.cjs`);
          await waitForArtifact({
            client: new DefaultArtifactClient(),
            artifactName: process.env.ARTIFACT_NAME,
            artifactId: process.env.ARTIFACT_ID,
            log: core.info,
          });
