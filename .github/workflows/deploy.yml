name: Build, test, and deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test, and deploy games
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'pull-request' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Porcupine Spikey
        working-directory: porcupine-spikey
        run: node --test tests/game.test.cjs

      - name: Test Panda's Hideout
        if: ${{ !cancelled() }}
        working-directory: pandas-hideout
        run: node --test tests/game.test.cjs

      - name: Test Gobble Gobble Turkey
        if: ${{ !cancelled() }}
        working-directory: gobble-gobble-turkey
        run: node --test tests/game.test.cjs

      - name: Test Grass Adventure
        if: ${{ !cancelled() }}
        working-directory: grass-adventure
        run: npm test

      - name: Prepare static site
        run: |
          install -Dm644 index.html _site/index.html
          install -Dm644 gobble-gobble-turkey/index.html _site/gobble-gobble-turkey/index.html
          install -Dm644 porcupine-spikey/index.html _site/porcupine-spikey/index.html
          install -Dm644 -t _site/pandas-hideout pandas-hideout/{index.html,LICENSE}
          install -Dm644 -t _site/grass-adventure grass-adventure/{index.html,engine.js,game.js,style.css,LICENSE}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
