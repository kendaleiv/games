name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-porcupine-spikey:
    name: Test Porcupine Spikey
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        working-directory: porcupine-spikey
        env:
          GAME_TEST_REPORT: ${{ runner.temp }}/difficulty/porcupine-spikey.json
        run: node --test tests/game.test.cjs

      - name: Upload difficulty report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: difficulty-porcupine-spikey
          path: ${{ runner.temp }}/difficulty/porcupine-spikey.json
          if-no-files-found: error

  test-pandas-hideout:
    name: Test Panda's Hideout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        working-directory: pandas-hideout
        env:
          GAME_TEST_REPORT: ${{ runner.temp }}/difficulty/pandas-hideout.json
        run: node --test tests/game.test.cjs

      - name: Upload difficulty report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: difficulty-pandas-hideout
          path: ${{ runner.temp }}/difficulty/pandas-hideout.json
          if-no-files-found: error

  deploy:
    needs: [test-porcupine-spikey, test-pandas-hideout]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Gobble Gobble Turkey
        working-directory: gobble-gobble-turkey
        env:
          GAME_TEST_REPORT: ${{ runner.temp }}/difficulty/gobble-gobble-turkey.json
        run: node --test tests/game.test.cjs

      - name: Test Grass Adventure
        working-directory: grass-adventure
        env:
          GAME_TEST_REPORT: ${{ runner.temp }}/difficulty/grass-adventure.json
        run: npm test

      - name: Upload difficulty reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: difficulty-race-and-adventure
          path: ${{ runner.temp }}/difficulty/*.json
          if-no-files-found: error

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          install -Dm644 index.html _site/index.html
          install -Dm644 gobble-gobble-turkey/index.html _site/gobble-gobble-turkey/index.html
          install -Dm644 porcupine-spikey/index.html _site/porcupine-spikey/index.html
          install -Dm644 -t _site/pandas-hideout pandas-hideout/{index.html,LICENSE}
          install -Dm644 -t _site/grass-adventure grass-adventure/{index.html,engine.js,game.js,style.css,LICENSE}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
