name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Gobble Gobble Turkey
        working-directory: gobble-gobble-turkey
        run: node --test tests/game.test.cjs

      - name: Test Grass Adventure
        working-directory: grass-adventure
        run: npm test

      - name: Test Porcupine Spikey and Panda's Hideout
        run: node --test porcupine-spikey/tests/game.test.cjs pandas-hideout/tests/game.test.cjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          install -Dm644 index.html _site/index.html
          install -Dm644 gobble-gobble-turkey/index.html _site/gobble-gobble-turkey/index.html
          install -Dm644 porcupine-spikey/index.html _site/porcupine-spikey/index.html
          install -Dm644 -t _site/pandas-hideout pandas-hideout/{index.html,LICENSE}
          install -Dm644 -t _site/grass-adventure grass-adventure/{index.html,engine.js,game.js,style.css,LICENSE}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
